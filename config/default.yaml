scanner:
  interval_minutes: 5
  market_timezone: Asia/Kolkata
  market_open: "09:15"
  market_close: "15:30"
  signal_max_age_seconds: 420
  loop_boundary_delay_seconds: 2
  max_workers: 32
  state_file: var/sent_signals.json

provider:
  dhan_timeout_seconds: 1.0
  yfinance_timeout_seconds: 8.0
  lookback_days: 2
  yfinance_batch_size: 50

strategy:
  liquidity_lookback_bars: 10
  volume_lookback_bars: 20
  range_lookback_bars: 20
  max_setup_bars: 10
  min_context_bars: 8
  min_decline_pct: 1.8
  sweep_tolerance_pct: 0.05
  min_spring_close_location: 0.25
  stopping_volume_ratio: 1.50
  spring_wick_body_ratio: 1.50
  test_min_bars_after_spring: 2
  test_max_fraction_of_recovery: 0.55
  test_min_close_location: 0.55
  test_min_wick_body_ratio: 1.20
  test_max_spring_volume_ratio: 0.70
  no_supply_max_test_volume_ratio: 0.65
  no_supply_max_median_range_ratio: 0.85
  sos_min_body_ratio: 0.65
  sos_min_range_ratio: 1.35
  sos_min_volume_ratio: 1.40
  sos_min_previous_volume_ratio: 1.30
  min_score: 65
  stop_atr_buffer: 0.05

filters:
  min_price: 20.0
  max_price: 10000.0
  min_session_turnover_inr: 10000000
  alert_watch_stage: false

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=reversal_scanner --cov-report=term-missing
      - name: ORCHPHARMA walk-forward smoke test
        run: reversal-scanner backtest tests/fixtures/orchpharma_2026-06-16_5m.csv --symbol ORCHPHARMA

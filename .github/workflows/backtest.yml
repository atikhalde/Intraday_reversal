name: 2 - Past backtest PDF

on:
  workflow_dispatch:
    inputs:
      source:
        description: Dhan credentials first; failed symbols fall back immediately to yfinance
        required: true
        default: dhan
        type: choice
        options:
          - dhan
          - yfinance
          - fixture
      symbols:
        description: NSE_NIFTY_500 for all 500 stocks, or comma-separated symbols; fixture uses ORCHPHARMA
        required: true
        default: NSE_NIFTY_500
        type: string
      start_date:
        description: First session, YYYY-MM-DD (required)
        required: true
        type: string
      end_date:
        description: Last session, YYYY-MM-DD, inclusive (required)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: past-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      INPUT_SOURCE: ${{ inputs.source }}
      INPUT_SYMBOLS: ${{ inputs.symbols }}
      INPUT_START: ${{ inputs.start_date }}
      INPUT_END: ${{ inputs.end_date }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanner
        run: python -m pip install --upgrade pip && pip install .
      - name: Validate inputs and Dhan secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INPUT_START" || { echo "Start date is required"; exit 1; }
          test -n "$INPUT_END" || { echo "End date is required"; exit 1; }
          if [[ "$INPUT_SOURCE" == "dhan" ]]; then
            test -n "$DHAN_CLIENT_ID" || { echo "Missing DHAN_CLIENT_ID secret"; exit 1; }
            test -n "$DHAN_ACCESS_TOKEN" || { echo "Missing DHAN_ACCESS_TOKEN secret"; exit 1; }
          fi
          if [[ "$INPUT_SOURCE" == "fixture" && "${INPUT_SYMBOLS^^}" != "ORCHPHARMA" ]]; then
            echo "Fixture mode is the ORCHPHARMA 2026-06-16 demo; set symbols to ORCHPHARMA"
            exit 1
          fi
      - name: Run walk-forward historical backtest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          args=(backtest-report
            --source "$INPUT_SOURCE"
            --symbols "$INPUT_SYMBOLS"
            --start "$INPUT_START"
            --end "$INPUT_END"
            --output-pdf artifacts/backtest-report.pdf
            --results-csv artifacts/backtest-results.csv)
          if [[ "$INPUT_SOURCE" == "fixture" ]]; then
            args+=(--fixture tests/fixtures/orchpharma_2026-06-16_5m.csv)
          fi
          reversal-scanner "${args[@]}"
      - name: Upload PDF report and detailed CSV
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: past-backtest-${{ github.run_number }}
          path: |
            artifacts/backtest-report.pdf
            artifacts/backtest-results.csv
          if-no-files-found: error
          retention-days: 30
